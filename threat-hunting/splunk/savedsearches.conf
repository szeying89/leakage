[CVE-2026-23918 - Suspicious Apache Child Process]
description = Detects shell, scripting, transfer, or admin utilities spawned by Apache processes, supporting possible RCE detection.
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
action.email = 0
alert.severity = 5
search = | tstats summariesonly=false allow_old_summaries=true count min(_time) as first_seen max(_time) as last_seen from datamodel=Endpoint.Processes where (Processes.parent_process_name IN (httpd,apache2,"httpd.exe","apache.exe") OR Processes.parent_process IN ("*httpd*","*apache2*","*Apache*")) Processes.process_name IN (sh,bash,dash,zsh,ksh,python,python3,perl,php,ruby,node,nc,ncat,socat,curl,wget,powershell,pwsh,cmd.exe,certutil.exe,bitsadmin.exe) by Processes.dest Processes.user Processes.parent_process_name Processes.parent_process Processes.process_name Processes.process Processes.process_id Processes.parent_process_id | rename Processes.* as * | convert ctime(first_seen) ctime(last_seen) | lookup cve_2026_23918_approved_scanners user OUTPUT scanner_name | where isnull(scanner_name) | eval severity="critical" | sort 0 - count

