[CVE-2026-23918 - Apache 2.4.66 HTTP2 Exposure]
description = Finds Apache HTTP Server 2.4.66 assets where HTTP/2 appears enabled or reachable, matching CVE-2026-23918 exposure preconditions.
disabled = 1
enableSched = 1
cron_schedule = 17 */4 * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
action.email = 0
alert.severity = 5
search = (index=asset_inventory OR index=vulnerability OR index=edr_inventory) (product="Apache HTTP Server" OR product="Apache" OR process_name IN (httpd,apache2)) (apache_version="2.4.66" OR version="2.4.66" OR package_version="2.4.66") (http2_enabled=true OR http2_enabled="true" OR alpn="h2" OR module="mod_http2") | eval exposure_zone=coalesce(exposure_zone, network_zone, zone, "unknown") | eval risk=case(exposure_zone IN ("internet","external","public","partner","untrusted"), "critical", exposure_zone IN ("internal","corp","vpn","dmz"), "high", true(), "medium") | stats latest(_time) as last_seen values(product) as product values(apache_version) as apache_version values(version) as version values(package_version) as package_version values(http2_enabled) as http2_enabled values(alpn) as alpn values(module) as module values(exposure_zone) as exposure_zone values(risk) as risk by host asset_id ip | convert ctime(last_seen) | sort 0 risk host

[CVE-2026-23918 - HTTP2 Reset Burst From Single Source]
description = Detects high-volume HTTP/2 stream or connection resets from one source against Apache-backed services.
disabled = 1
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
action.email = 0
alert.severity = 4
search = (index=web OR index=waf OR index=cdn OR index=lb) (protocol="HTTP/2" OR protocol="h2" OR http_version="2" OR alpn="h2") (termination_reason IN ("stream_reset","client_reset","aborted_stream","connection_reset","reset") OR action IN ("reset","aborted") OR status IN (0,408,499,520)) (backend_product="Apache HTTP Server" OR server="Apache" OR upstream_server="Apache" OR backend_version="2.4.66") | bin _time span=10m | stats count as reset_events dc(user_agent) as user_agents values(user_agent) as sample_user_agents values(uri_path) as sample_paths values(status) as statuses values(action) as actions by _time src_ip dest host | where reset_events >= 50 | lookup cve_2026_23918_approved_scanners ip as src_ip OUTPUT scanner_name | where isnull(scanner_name) | eval severity=if(reset_events>=150, "critical", "high") | sort 0 - reset_events

