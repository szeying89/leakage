[CVE-2026-23918 - Apache Crash Allocator Or Core Dump]
description = Detects Apache crash, allocator, double-free, segmentation-fault, or core-dump evidence that may indicate CVE-2026-23918 effect-stage activity.
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
action.email = 0
alert.severity = 5
search = (index=os OR index=apache OR index=syslog OR index=crash) (source="*error_log*" OR sourcetype IN (apache:error,syslog,journald,linux_secure,crash_report)) ("httpd" OR "apache2" OR "Apache") ("segmentation fault" OR "segfault" OR "double free" OR "malloc" OR "free():" OR "corrupted" OR "core dumped" OR "exit signal Segmentation fault" OR "child pid") | eval crash_indicator=case(match(_raw,"(?i)double free"),"double_free", match(_raw,"(?i)segmentation fault|segfault"),"segfault", match(_raw,"(?i)malloc|corrupt|free\(\)"),"allocator_error", match(_raw,"(?i)core dumped"),"core_dump", true(),"apache_crash") | bin _time span=10m | stats count as crash_events values(crash_indicator) as crash_indicators values(source) as sources values(sourcetype) as sourcetypes values(_raw) as sample_events by _time host | where crash_events >= 1 | eval severity="critical" | sort 0 - crash_events

